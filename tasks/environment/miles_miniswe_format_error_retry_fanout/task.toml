[submitter]
name = "AutoRLBench Task Builder"

[model]
name = "Qwen/Qwen3-30B-A3B"

[dataset]
name = "SWE-bench Verified (16 deterministic prompts)"

[training]
framework = "miles"
algo = "GRPO"
script = "run.sh"

[environment]
image = "ghcr.io/merak0514/autorlbench-justrl2@sha256:8d2eb1fe292a4e381915734b7854213002ca9bae6b50efab1bd8cc75cad14a8b"
