gpus = 8

[outcome]
failure_type = "agentic_environment_format_error_fanout"
failure_reason = "MiniSWE 2.4.6 omits sampled assistant attempts that fail tool-call parsing from the history sent on its next request, so TITO-v2 records those attempts as sibling tree nodes; 64 intended logical rollouts therefore yield 164 training leaves, with fan-out in 30 rollouts and a maximum of 21 leaves per rollout."
success_evidence = "$AUTORLBENCH_RESULTS/experiment_logs/metrics.json"
