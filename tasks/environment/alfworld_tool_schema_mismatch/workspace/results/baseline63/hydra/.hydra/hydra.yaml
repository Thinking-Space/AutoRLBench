hydra:
  run:
    dir: /output/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - pkg://verl.trainer.config
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/output/hydra
    - hydra.mode=RUN
    task:
    - ray_kwargs.ray_init.num_cpus=40
    - +ray_kwargs.ray_init.object_store_memory=2147483648
    - +ray_kwargs.ray_init._temp_dir=/output/ray
    - algorithm.adv_estimator=grpo
    - data.train_files=/workspace/tool_schema/datasets/alfworld/difficulty-v1-s42/train.parquet
    - data.val_files=/workspace/tool_schema/datasets/alfworld/balanced1008-s42/validation.parquet
    - data.train_batch_size=16
    - data.val_batch_size=8
    - data.seed=42
    - data.shuffle=False
    - data.max_prompt_length=4096
    - data.max_response_length=12288
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - data.return_raw_chat=True
    - +data.apply_chat_template_kwargs.enable_thinking=False
    - actor_rollout_ref.model.path=/model
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.actor.strategy=fsdp2
    - actor_rollout_ref.actor.fsdp_config.offload_policy=False
    - actor_rollout_ref.actor.fsdp_config.model_dtype=fp32
    - actor_rollout_ref.ref.fsdp_config.offload_policy=False
    - actor_rollout_ref.ref.fsdp_config.model_dtype=bf16
    - actor_rollout_ref.actor.ppo_mini_batch_size=16
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.ref.fsdp_config.param_offload=False
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.4
    - actor_rollout_ref.rollout.enforce_eager=False
    - actor_rollout_ref.rollout.max_model_len=16384
    - actor_rollout_ref.rollout.max_num_seqs=8
    - +actor_rollout_ref.rollout.engine_kwargs.vllm.max_model_len=16384
    - +actor_rollout_ref.rollout.engine_kwargs.vllm.seed=42
    - actor_rollout_ref.rollout.n=4
    - actor_rollout_ref.rollout.val_kwargs.n=1
    - actor_rollout_ref.rollout.val_kwargs.do_sample=False
    - actor_rollout_ref.rollout.agent.num_workers=16
    - actor_rollout_ref.rollout.agent.default_agent_flow=alfworld_schema
    - actor_rollout_ref.rollout.agent.agent_flow_config_path=/workspace/tool_schema/alfworld_case/alfworld_schema.yaml
    - actor_rollout_ref.rollout.multi_turn.format=hermes
    - reward_model.enable=False
    - critic.enable=False
    - algorithm.use_kl_in_reward=False
    - custom_reward_function.path=/workspace/tool_schema/vendor/Agent-R1/recipes/alfworld/reward_fn.py
    - custom_reward_function.name=compute_score
    - trainer.logger=["console","wandb"]
    - trainer.project_name=alfworld-tool-schema
    - trainer.experiment_name=alfworld
    - trainer.default_local_dir=/output/checkpoints
    - trainer.validation_data_dir=/output/validation
    - trainer.rollout_data_dir=/output/rollouts
    - trainer.n_gpus_per_node=4
    - trainer.nnodes=1
    - trainer.val_before_train=True
    - trainer.test_freq=20
    - trainer.save_freq=-1
    - trainer.total_training_steps=63
    - trainer.total_epochs=1
  job:
    name: main_agent_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.rollout.engine_kwargs.vllm.max_model_len=16384,+actor_rollout_ref.rollout.engine_kwargs.vllm.seed=42,+data.apply_chat_template_kwargs.enable_thinking=False,+ray_kwargs.ray_init._temp_dir=/output/ray,+ray_kwargs.ray_init.object_store_memory=2147483648,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.model_dtype=fp32,actor_rollout_ref.actor.fsdp_config.offload_policy=False,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=16,actor_rollout_ref.actor.strategy=fsdp2,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/model,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.model_dtype=bf16,actor_rollout_ref.ref.fsdp_config.offload_policy=False,actor_rollout_ref.ref.fsdp_config.param_offload=False,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.agent.agent_flow_config_path=/workspace/tool_schema/alfworld_case/alfworld_schema.yaml,actor_rollout_ref.rollout.agent.default_agent_flow=alfworld_schema,actor_rollout_ref.rollout.agent.num_workers=16,actor_rollout_ref.rollout.enforce_eager=False,actor_rollout_ref.rollout.gpu_memory_utilization=0.4,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.max_model_len=16384,actor_rollout_ref.rollout.max_num_seqs=8,actor_rollout_ref.rollout.multi_turn.format=hermes,actor_rollout_ref.rollout.n=4,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.val_kwargs.do_sample=False,actor_rollout_ref.rollout.val_kwargs.n=1,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,critic.enable=False,custom_reward_function.name=compute_score,custom_reward_function.path=/workspace/tool_schema/vendor/Agent-R1/recipes/alfworld/reward_fn.py,data.filter_overlong_prompts=True,data.max_prompt_length=4096,data.max_response_length=12288,data.return_raw_chat=True,data.seed=42,data.shuffle=False,data.train_batch_size=16,data.train_files=/workspace/tool_schema/datasets/alfworld/difficulty-v1-s42/train.parquet,data.truncation=error,data.val_batch_size=8,data.val_files=/workspace/tool_schema/datasets/alfworld/balanced1008-s42/validation.parquet,ray_kwargs.ray_init.num_cpus=40,reward_model.enable=False,trainer.default_local_dir=/output/checkpoints,trainer.experiment_name=alfworld,trainer.logger=["console","wandb"],trainer.n_gpus_per_node=4,trainer.nnodes=1,trainer.project_name=alfworld-tool-schema,trainer.rollout_data_dir=/output/rollouts,trainer.save_freq=-1,trainer.test_freq=20,trainer.total_epochs=1,trainer.total_training_steps=63,trainer.val_before_train=True,trainer.validation_data_dir=/output/validation
    id: ???
    num: ???
    config_name: agent_ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /workspace/tool_schema/vendor/Agent-R1
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/tool_schema/vendor/Agent-R1/agent_r1/config
      schema: file
      provider: main
    - path: verl.trainer.config
      schema: pkg
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /output/hydra
    choices:
      algorithm@algorithm.rollout_correction: rollout_correction
      reward_model: dp_reward_loop
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      data: legacy_data
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
