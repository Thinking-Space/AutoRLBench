title = "ALFWorld tool-schema name mismatch"
license = "MIT"
created_date = "2026-10-20"
domain = "environment"
tags = ["agent-r1", "grpo", "alfworld", "tool-use", "schema-mismatch"]

[submitter]
name = "cyh2004"

[model]
name = "Qwen/Qwen3-4B"

[dataset]
name = "ALFWorld difficulty-v1-s42 train (636 unique tasks, 1008 stratified draws) / balanced1008-s42 validation (96 games: 48 seen + 48 unseen, 16 per family)"

[training]
framework = "agent-r1"
algo = "grpo"
script = "tool_schema/alfworld_case/train.sh"

[environment]
# The task was delivered against `agent-r1-alfworld`, but that environment has
# no docker/images/<name>.Dockerfile — the single source of truth for which
# images exist — and no image on the platform, so the schema rejected it and
# every trial failed before reaching a devspace. Pointed at the verl image to
# unblock the issue-level sweep: that level is read-only diagnosis plus an LLM
# judge, and this task's prepare.sh only fetches Qwen3-4B without importing
# anything, so it does not depend on the image's Python env.
# NOT valid for the solution level, which retrains under agent-r1.
image = "verl"

[environment.env]
CUDA_VISIBLE_DEVICES = "0,1,2,3"
NVIDIA_VISIBLE_DEVICES = "0,1,2,3"
N_GPUS = "4"

[outcome]
failure_type = "tool_schema_mismatch"
failure_reason = "The tool schema advertised to the policy renames the clean/heat/cool tools to clean_object/heat_object/cool_object, but the environment's executor registry and dispatcher still only know clean/heat/cool, so every cleaning/heating/cooling call returns unknown_tool without advancing the environment; held-out success on those three task families stays at zero and overall validation success plateaus far below the matched-schema control."
