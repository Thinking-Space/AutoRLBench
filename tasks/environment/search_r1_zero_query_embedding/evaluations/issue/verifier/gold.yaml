category: implementation
framework: search-r1-verl
task: search_r1_zero_query_vector
verdict: unhealthy
root_cause:
- name: retriever_query_device_copy
  where: Search-R1/search_r1/search/retrieval_server.py::Encoder.encode (lines 117-120)
  observed: >-
    the encoded query embedding never reaches the NumPy buffer that is returned.
    response_buffer is a zero-filled CPU array; torch.as_tensor(response_buffer,
    device=query_emb.device) with query_emb on CUDA is a cross-device copy, so
    writer is a new GPU tensor that does not alias response_buffer.
    writer.copy_(query_emb) updates only that tensor, and query_emb =
    response_buffer returns an all-zero matrix of the right shape and dtype, so
    every query vector handed to FAISS is zero.
  expected: >-
    move the embedding to the host before FAISS sees it --
    query_emb = query_emb.detach().cpu().numpy() followed by
    astype(np.float32, order="C"). .cpu() is what fixes the transfer; .detach()
    only drops the autograd reference.
evidence_metrics:
- every document score in results/baseline32/retrieval.jsonl is 0.0 and the same three
  documents are returned for every query in a batch ("Scott Derrickson nationality" ->
  "Sheep-goat hybrid"); the shipped file is an excerpt (8 batches, 289 queries, 867
  hits, all zero-scored, one document combination), and the full-trace audit of the
  original run counted 13959 zero scores with the same single combination
- a zero query vector is legal under METRIC_INNER_PRODUCT: all documents score 0.0, so
  FAISS returns an arbitrary but constant top-k and nothing raises
- load_model (retrieval_server.py:38-46) calls model.cuda(), which is what makes
  torch.as_tensor(..., device=...) allocate instead of alias; the same code is correct
  on a CPU-only encoder, which is why it reads as fine
- frozen val/em rises 3.125% -> 15.625% and val/f1 8.970% -> 24.703% over 32 steps, while
  the recorded control with the two-line host copy reaches 32.813% / 41.430% from a step-0
  val/em of 13.281%
- held-out retrieval with the question as the query has supporting-title recall@3 0.0 and
  any-supporting-document hit@3 0.0, against 0.809 / 0.977 for the control
- one retriever serves rollout and evaluation (serve_retriever.py imports this module,
  run.py points both at the same port), so the defect is on both paths
- val/searched 1.0, val/format ~1.0, env/number_of_valid_search 0.93-1.02: the multi-turn
  search protocol works, the retrieved text is simply unrelated to the question
- Search-R1/search_r1/search/retrieval.py:127-128 holds the same Encoder.encode in a
  sibling unserved module and ends with the correct two lines (index_builder.py:237 does
  the same for documents); the in-tree inconsistency is legitimate evidence
- the defective run does improve (+12.5 pp); "the run does not learn" is a misreading, and
  training-side reward does not establish held-out health
fix:
  must:
  - target: retriever_query_device_copy
    direction: copy the embedding to the host (.detach().cpu().numpy()) before FAISS
