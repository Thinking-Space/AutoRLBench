category: implementation
framework: search-r1-verl
task: search_r1_zero_query_vector
verdict: unhealthy
root_cause:
- name: retriever_query_device_copy
  where: Search-R1/search_r1/search/retrieval_server.py::Encoder.encode (lines 117-120)
  observed: >-
    response_buffer is a zero-filled CPU array and
    torch.as_tensor(response_buffer, device=query_emb.device) is a cross-device copy,
    so writer does not alias it; writer.copy_(query_emb) updates only the new GPU
    tensor and the returned query_emb is all zeros. Under METRIC_INNER_PRODUCT every
    document then scores 0.0, so FAISS returns a constant top-3 for every query
    without raising.
  expected: >-
    query_emb = query_emb.detach().cpu().numpy() followed by
    astype(np.float32, order="C"); .cpu() is the part that fixes the transfer.
evidence_metrics:
- frozen val/em 3.125% -> 15.625% and val/f1 8.970% -> 24.703% over 32 steps; the
  recorded control reaches 32.813% / 41.430% from a step-0 val/em of 13.281%
- every document score in results/baseline32/retrieval.jsonl is 0.0 with one document
  combination for all queries
- held-out supporting-title recall@3 is 0.0 against the control's 0.809
- one retriever serves rollout and evaluation, so both paths are affected
- the defective run does improve (+12.5 pp); the defect is the shortfall against the
  control, not an absence of learning
fix:
  must:
  - target: retriever_query_device_copy
    direction: copy the embedding to the host (.detach().cpu().numpy()) before FAISS
solution_metric:
  key: val/em
  final_step: 32
  score_mode: best
  historical_final_baseline: 0.15625
  required_final_score: 0.24
  required_final_score_max: 1.0
  note: >-
    Machine grading reads only the new experiment logs under
    $AUTORLBENCH_RESULTS/experiment_logs. The budget is the one already in
    workspace/config.json (steps 32, eval_every 10), so the rerun has eval points
    0, 10, 20, 30, 32; score_mode is best, so the graded value is the highest finite
    val/em over those points. Pass is score 1 if it lands in [0.24, 1.0]; otherwise 0.
    Calibrated on the recorded pair -- ONE run per side, both completing 32 steps:
    defective best 0.15625, repaired best 0.32813, repaired step-0 0.13281. The bar
    sits 0.084 above the defective ceiling and 0.088 below the repaired value, and
    above the repaired step-0 point so that a fix without a completed run does not
    pass. Unlike slime_search_r1_nomask, whose bar rests on four measured runs, this
    threshold has no variance estimate: a second pair at this budget is the follow-up
    that would justify tightening or moving it. Reruns are not expected to be
    bit-identical -- the FAISS index is rebuilt at prepare time rather than shipped,
    and GPU nondeterminism applies.
