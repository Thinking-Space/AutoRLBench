title = "Tool observations erase earlier SQL action returns"
license = "Apache-2.0"
created_date = "2026-11-03"
domain = "algorithm"
tags = ["verl", "tool-use", "issue-only"]
[submitter]
name = "PurvaChiniya"
[model]
name = "Qwen/Qwen3-4B"
[dataset]
name = "Generated operations SQL: 512 train, 12 pilot development, 128 sealed cases"
[training]
framework = "verl"
algo = "REINFORCE++"
script = "run.sh"
[environment]
# Build-recipe exception (see docker/README.md "Exceptions"): the stack
# captured from the paired Modal runs (Python 3.12, torch 2.11.0, vLLM
# 0.24.0), so docker/images/tool-rl-vllm024.Dockerfile holds the recipe and
# must be built and pushed as autorlbench/tool-rl-vllm024:py312-cu130 once;
# the image pull fails until then. After the push, collapse the Dockerfile
# to a digest-pinned one-liner.
image = "tool-rl-vllm024"

# 2 GPUs, matching the recorded runs: train.py pins
# trainer.n_gpus_per_node=2, trainer.nnodes=1. docker exposes them as
# cuda:0..1 via --gpus; harbor synthesizes the compose device reservation
# from this count.
gpus = 2
[outcome]
failure_type = "verl_reinforcepp_observation_credit"
failure_reason = "The reverse return scan resets at masked tool observations, removing terminal reward from earlier SQL action tokens."

[security]
requires_isolated_stages = true
