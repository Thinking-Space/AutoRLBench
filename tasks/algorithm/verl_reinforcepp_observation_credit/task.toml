title = "Tool observations erase earlier SQL action returns"
license = "Apache-2.0"
created_date = "2026-11-03"
domain = "algorithm"
tags = ["verl", "tool-use", "issue-only"]
[submitter]
name = "PurvaChiniya"
[model]
name = "Qwen/Qwen3-4B"
[dataset]
name = "Generated operations SQL: 512 train, 12 pilot development, 128 sealed cases"
[training]
framework = "verl"
algo = "REINFORCE++"
script = "run.sh"
[environment]
image = "tool-rl-vllm024"
prepare = "environment/prepare.sh"
[environment.env]
CUDA_VISIBLE_DEVICES = "0,1"
NVIDIA_VISIBLE_DEVICES = "0,1"
[outcome]
failure_type = "verl_reinforcepp_observation_credit"
failure_reason = "The reverse return scan resets at masked tool observations, removing terminal reward from earlier SQL action tokens."

[security]
requires_isolated_stages = true
