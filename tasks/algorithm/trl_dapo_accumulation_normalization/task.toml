title = "GRPO generation and accumulation windows"
license = "Apache-2.0"
created_date = "2026-10-30"
domain = "algorithm"
tags = ["trl", "grpo", "gsm8k"]

[submitter]
name = "Haoyang Su"
github = "Hoyant-Su"
affiliation = "Fudan University; Shanghai Innovation Institute"

[model]
name = "Qwen2.5-0.5B-Instruct"

[dataset]
name = "GSM8K"

[training]
framework = "TRL"
algo = "GRPO with DAPO loss"
script = "train.sh"

[environment]
# Build-recipe exception (see docker/README.md "Exceptions"): no published
# image carries the TRL GRPO stack, so docker/images/trl-grpo-torch26.Dockerfile
# holds the recipe and must be built and pushed as
# autorlbench/trl-grpo-torch26:py312-cu124 once; the image pull fails until
# then. After the push, collapse the Dockerfile to a digest-pinned one-liner.
# Build recipe not yet built/pushed (see docker/README.md "Exceptions");
# pin the digest here once the image is pushed.
image = "autorlbench/trl-grpo-torch26:py312-cu124"
image_stack = "trl-grpo-torch26"

# 1 GPU, matching the recorded runs: run_training.sh drives
# torch.distributed.run with --nproc_per_node=1 on a single H100 80 GB.
# docker exposes it as cuda:0 via --gpus; harbor synthesizes the compose
# device reservation from this count.
gpus = 1

[outcome]
failure_type = "objective normalization error"
failure_reason = "The generation token denominator is not scaled to the accumulation window, giving half the intended loss."
