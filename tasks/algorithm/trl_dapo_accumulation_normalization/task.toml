title = "GRPO generation and accumulation windows"
license = "Apache-2.0"
created_date = "2026-10-30"
domain = "algorithm"
tags = ["trl", "grpo", "gsm8k"]

[submitter]
name = "Haoyang Su"
github = "Hoyant-Su"
affiliation = "Fudan University; Shanghai Innovation Institute"

[model]
name = "Qwen2.5-0.5B-Instruct"

[dataset]
name = "GSM8K"

[training]
framework = "TRL"
algo = "GRPO with DAPO loss"
script = "train.sh"

[environment]
# Runs on the packaged vllm0.11-torch2.8-cu128 image — the same image five
# other tasks already use, platform-registered on Cybertron as
# ptdbench-vllm0.11-torch2.8-cu128. The recorded stack is torch 2.6.0 /
# cu124 / py3.12 with no engine; the image's torch 2.8.0 / cu128 compiled
# layer is native and self-consistent, the vLLM engine and flash-attn stay
# inert (train.py pins attn_implementation="sdpa" and use_vllm=False, and
# the recorded environment carried no vLLM at all), and prepare.sh shadows
# the recorded pure-Python majors into $AUTORLBENCH_PREPARED/pysite. The
# graded metric is a structural step count recomputed by the grader from
# the run records, so the 23.5 threshold carries over from the torch 2.6
# recording.
image = "ghcr.io/yhyayi/autorlbench:vllm0.11-torch2.8-cu128@sha256:6f7c302c0161a6c32d978faade165c86c153575baf028e729d7eebe44c06f683"
image_stack = "vllm0.11.0-torch2.8.0-flashattn2.8.3-cu128-py3.12"

# 1 GPU, matching the recorded runs: run_training.sh drives
# torch.distributed.run with --nproc_per_node=1 on a single H100 80 GB.
# docker exposes it as cuda:0 via --gpus; harbor synthesizes the compose
# device reservation from this count.
gpus = 1

[outcome]
failure_type = "objective normalization error"
failure_reason = "The generation token denominator is not scaled to the accumulation window, giving half the intended loss."
