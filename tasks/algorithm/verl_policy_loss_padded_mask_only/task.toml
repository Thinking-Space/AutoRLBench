[environment]
# Runs on the packaged vllm0.11-torch2.8-cu128 image — the same compiled
# layer the recorded verl 0.6.1 environment ran on (vLLM 0.11.0 ·
# torch 2.8.0 · flash-attn 2.8.3.post1 · cu128 · py3.12). The recorded
# venv's pure-Python pins that matter here (pyarrow 19.0.1 ·
# transformers 4.57.1 · numpy 1.26.4) are shadowed at prepare time into
# $AUTORLBENCH_PREPARED/pysite — see environment/prepare.sh.
image = "ghcr.io/yhyayi/autorlbench:vllm0.11-torch2.8-cu128@sha256:6f7c302c0161a6c32d978faade165c86c153575baf028e729d7eebe44c06f683"
image_stack = "vllm0.11.0-torch2.8.0-flashattn2.8.3-cu128-py3.12"

# 8 GPUs, matching the recorded runs: run_protocol.py:64 requires eight
# visible GPUs for the local 2x4 rerun of the recorded two-node x four-GPU
# topology. docker exposes them as cuda:0..7 via --gpus; harbor synthesizes
# the compose device reservation from this count. TOKENIZERS_PARALLELISM
# (formerly in [environment.env]) is seeded by prepare.sh into prepared/env.
gpus = 8
[outcome]
failure_type = "nonstandard_policy_objective_candidate"
failure_reason = "Padded custom GRPO objective: mask-only repair"
