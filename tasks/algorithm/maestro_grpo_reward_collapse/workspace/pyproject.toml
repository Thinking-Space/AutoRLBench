[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro4autorlbench"
version = "0.1.0"
description = "Minimal multimodal GRPO training bundle for train_4_gpus.sh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "verl",
    "aiofiles",
    "aiohttp",
    "fastapi",
    "fire>=0.7.0",
    "httpx",
    "ipython",
    "librosa",
    "loguru",
    "math-verify",
    "openai",
    "pillow",
    "psutil",
    "pylatexenc",
    "pyyaml",
    "qwen_vl_utils>=0.0.14",
    "regex",
    "soundfile",
    "sympy",
    "torchvision",
    "uvicorn",
    "vllm==0.11.0",
    "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verl_tool*", "router_r1*", "tools*"]
namespaces = true

[tool.setuptools.package-data]
verl_tool = ["trainer/config/*.yaml", "trainer/config/*/*.yaml", "trainer/runtime_env.yaml"]
