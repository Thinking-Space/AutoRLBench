[outcome]
failure_type = "excluded_rollout_contaminates_grpo_baseline"
failure_reason = "The historical cost-budget callback normalizes all terminal rollout rewards before training exclusion, so a zero-reward interrupted rollout changes a valid sample's advantage from -0.707104 to +0.132453 despite contributing no effective training advantage itself."
