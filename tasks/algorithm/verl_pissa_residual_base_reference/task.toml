title = "PiSSA residual base used as the KL reference"
license = "Apache-2.0"
created_date = "2026-11-01"
domain = "algorithm"
tags = ["verl", "grpo", "pissa", "lora", "kl-reference"]

[submitter]
name = "Ruijia Zhang"
email = "rzhan127@jh.edu"

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct + PiSSA rank 8"

[dataset]
name = "openai/gsm8k deterministic calibration subset (16 train, 8 validation)"

[training]
framework = "verl"
algo = "GRPO"
script = "run_experiment.sh"

[environment]
# Runs on the packaged vllm0.11-torch2.8-cu128 image — the same compiled
# layer the recorded verl-vllm011 environment ran on (vLLM 0.11.0 ·
# torch 2.8.0 · flash-attn 2.8.3.post1 · cu128 · py3.12; the recorded venv
# carried no flash-attn, and the image's copy stays inert — the run pins
# attn_implementation=eager). The recorded venv's pure-Python pins that
# matter here (peft 0.18.0 · transformers 4.57.1 · datasets 4.0.0 ·
# pyarrow 19.0.1 · numpy 1.26.4 · accelerate 1.11.0 · tokenizers 0.22.1 ·
# scipy 1.17.1) are shadowed at prepare time into $AUTORLBENCH_PREPARED/
# pysite — see environment/prepare.sh.
image = "ghcr.io/yhyayi/autorlbench:vllm0.11-torch2.8-cu128@sha256:6f7c302c0161a6c32d978faade165c86c153575baf028e729d7eebe44c06f683"
image_stack = "vllm0.11.0-torch2.8.0-flashattn2.8.3-cu128-py3.12"

# Single-GPU task: FSDP actor and vLLM rollout colocated on one GPU, matching
# the recorded runs. docker exposes it as cuda:0 via --gpus; harbor
# synthesizes the compose device reservation from this count. WANDB_MODE and
# friends are exported by run_experiment.sh itself.
gpus = 1

[outcome]
failure_type = "implementation_bug"
failure_reason = "For a PiSSA residual-base checkpoint, disabling the adapter exposes W_residual rather than the original pretrained weights. The defective base-reference path therefore computes KL against the residual checkpoint: final base-reference consistency is 0.04578, while the repaired path reconstructing the frozen initial PiSSA adapter reaches 1.0 under the same four-update run."

[security]
requires_isolated_stages = true
