data:
  train_files: /workspace/data/train.parquet
  val_files: /workspace/data/test.parquet
  train_batch_size: 16
  max_prompt_length: 512
  max_response_length: 512
  filter_overlong_prompts: true
  seed: 42
actor_rollout_ref:
  model:
    path: /workspace/model
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 8
    use_torch_compile: false
    entropy_coeff: 0.001
    use_kl_loss: false
    optim:
      lr: 2.0e-06
      weight_decay: 0.0
      lr_warmup_steps: 0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
    ppo_epochs: 4
    checkpoint:
      contents:
      - model
      - optimizer
      - extra
      restore_scheduler: true
  ref:
    log_prob_micro_batch_size_per_gpu: 8
    fsdp_config:
      param_offload: false
  rollout:
    name: vllm
    'n': 8
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.2
    max_model_len: 1024
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    enforce_eager: true
    enable_chunked_prefill: false
    log_prob_micro_batch_size_per_gpu: 8
    temperature: 1.0
algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.0
custom_reward_function:
  path: /workspace/verl/utils/reward_score/arithmetic.py
  name: compute_score
trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 30
  total_epochs: 8
  logger:
  - console
  test_freq: 10
  save_freq: -1
  resume_mode: disable
  project_name: native_verl
  experiment_name: algorithm
  del_local_ckpt_after_load: false
benchmark:
  kind: algorithm
  resume_step: 4
