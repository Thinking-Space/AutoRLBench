title = "KPop binary-KL filter masks every saturated token in float32"
license = "Apache-2.0"
created_date = "2026-11-10"
domain = "algorithm"
tags = ["areal", "decoupled-ppo", "gsm8k", "kpop", "token-masking", "numerical-precision", "moe", "issue-only"]

[submitter]
name = "Kaixiang Zhao"
affiliation = "Brigham Young University"

[model]
name = "Qwen1.5-MoE-A2.7B-Chat"

[dataset]
name = "GSM8K (openai/gsm8k main): 7,473 train / 1,319 test"

[training]
framework = "AReaL"
algo = "decoupled PPO with KPop (bidirectional binary-KL) token masking"
script = "run.sh"

[environment]
image = "ghcr.io/areal-project/areal-runtime:v2.0.0-sglang@sha256:7ce1a21eee7cbdba6d1ac3d5cb5e1162edc392b8d499c9d5d7e17a1cf79276e3"
image_stack = "areal-v2.0.0-sglang0.5.10.post1-torch2.9.1-flashattn2.8.3-cu129-py3.12"
# One 8-GPU node: 4 SGLang rollout servers (sglang:d4p1t1) + 4 FSDP actor ranks (fsdp:d4p1t1),
# recorded on 8 x A100-SXM4 80 GB.
gpus = 8

[outcome]
failure_type = "implementation_bug"
failure_reason = "areal/utils/functional/functional.py::compute_binary_kl_divergence clamps probabilities in float32 with eps=1e-8, but 1.0 - 1e-8 rounds to 1.0, so every sampled token of probability exactly 1.0 yields a NaN/inf binary KL that the KPop bounds check (metric <= upper) rejects; the filter masks 0.0829 of tokens at step 0 (float64: 0.0000-0.0001) and up to 0.449 later, all at near-certain probability, held-out GSM8K eval-rollout/reward stays at 0.6073 -> 0.6128 -> 0.6021 against 0.6238 -> 0.6541 -> 0.6518 with a float64 binary KL, and final greedy GSM8K collapses to 0.0205 (base 0.5550)."
