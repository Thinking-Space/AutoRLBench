title = "Single-question training set: the policy stops reading the question"
license = "Apache-2.0"
created_date = "2026-11-17"
domain = "data"
tags = ["r1-v", "trl", "grpo", "vlm", "clevr", "train-eval-mismatch", "issue-only"]

[submitter]
name = "Yaolun Zhang"

[model]
name = "Qwen2-VL-2B-Instruct"

[dataset]
name = "CLEVR-CoGenT-A counting (train, held-out) + Super-CLEVR counting (out-of-distribution)"

[training]
framework = "R1-V (TRL GRPOTrainer subclass)"
algo = "grpo"
script = "run_grpo.sh"

[environment]
image = "hiyouga/verl@sha256:864124d32147f5e9b31916656b441f19d77c1c03e3448c8504b0025df59121b2"
image_stack = "verl-vllm0.7.4-torch2.5.1-flashattn2.7.4-cu124-py3.10"
# One GPU, matching the recorded run: run_grpo.sh starts torchrun with
# --nproc_per_node=1. The recorded run used one 80 GB card.
gpus = 1

[outcome]
failure_type = "train_eval_distribution_mismatch"
failure_reason = "data/train holds 68,000 rows that all ask the same question (\"How many items are there in the image?\") with answers 3-10 only, while the out-of-distribution held-out set data/ood_val asks 995 distinct questions over 1,000 rows and 864 of its answers are 0, 1 or 2. Under the exact-match count reward the policy learns to answer the total object count whatever the question says: out-of-distribution accuracy peaks at 0.675 at step 100 and falls to 0.251 at step 400, predictions in the range 3-10 grow from 225 to 626 of 1,000 (136 gold answers are in that range), while in-distribution held-out accuracy ends at 0.980 and the training reward stays above 0.93."
