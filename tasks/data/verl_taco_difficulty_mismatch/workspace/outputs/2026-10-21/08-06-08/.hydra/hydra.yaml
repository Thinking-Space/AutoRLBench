hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=/workspace/taco_verl/train.parquet
    - data.val_files=/workspace/taco_verl/test.parquet
    - data.train_batch_size=16
    - data.max_prompt_length=2048
    - data.max_response_length=4096
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - data.dataloader_num_workers=0
    - algorithm.use_kl_in_reward=False
    - actor_rollout_ref.model.path=/workspace/Qwen2.5-1.5B-Instruct
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - +actor_rollout_ref.model.override_config.attn_implementation=sdpa
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.actor.ppo_mini_batch_size=16
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.kl_loss_coef=0.02
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0.001
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.4
    - actor_rollout_ref.rollout.enable_chunked_prefill=False
    - actor_rollout_ref.rollout.enforce_eager=False
    - actor_rollout_ref.rollout.free_cache_engine=True
    - actor_rollout_ref.rollout.max_model_len=6144
    - actor_rollout_ref.rollout.max_num_batched_tokens=6144
    - actor_rollout_ref.rollout.n=8
    - actor_rollout_ref.rollout.val_kwargs.temperature=0.7
    - actor_rollout_ref.rollout.val_kwargs.do_sample=True
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.ref.fsdp_config.param_offload=True
    - reward.num_workers=32
    - reward.reward_manager.name=naive
    - reward.custom_reward_function.path=/workspace/verl/utils/reward_score/taco.py
    - reward.custom_reward_function.name=compute_score
    - trainer.critic_warmup=0
    - trainer.logger=["console","wandb"]
    - trainer.project_name=verl_grpo_taco
    - trainer.experiment_name=taco_qwen2_5_1.5b_grpo
    - trainer.rollout_data_dir=/workspace/rollout_data
    - trainer.validation_data_dir=/workspace/validation_data
    - trainer.n_gpus_per_node=4
    - trainer.nnodes=1
    - trainer.save_freq=400
    - trainer.test_freq=50
    - trainer.total_epochs=15
    - trainer.total_training_steps=400
    - trainer.use_v1=False
  job:
    name: main_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.model.override_config.attn_implementation=sdpa,actor_rollout_ref.actor.entropy_coeff=0.001,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.kl_loss_coef=0.02,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=16,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/workspace/Qwen2.5-1.5B-Instruct,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=True,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.enable_chunked_prefill=False,actor_rollout_ref.rollout.enforce_eager=False,actor_rollout_ref.rollout.free_cache_engine=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.4,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.max_model_len=6144,actor_rollout_ref.rollout.max_num_batched_tokens=6144,actor_rollout_ref.rollout.n=8,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.val_kwargs.do_sample=True,actor_rollout_ref.rollout.val_kwargs.temperature=0.7,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,data.dataloader_num_workers=0,data.filter_overlong_prompts=True,data.max_prompt_length=2048,data.max_response_length=4096,data.train_batch_size=16,data.train_files=/workspace/taco_verl/train.parquet,data.truncation=error,data.val_files=/workspace/taco_verl/test.parquet,reward.custom_reward_function.name=compute_score,reward.custom_reward_function.path=/workspace/verl/utils/reward_score/taco.py,reward.num_workers=32,reward.reward_manager.name=naive,trainer.critic_warmup=0,trainer.experiment_name=taco_qwen2_5_1.5b_grpo,trainer.logger=["console","wandb"],trainer.n_gpus_per_node=4,trainer.nnodes=1,trainer.project_name=verl_grpo_taco,trainer.rollout_data_dir=/workspace/rollout_data,trainer.save_freq=400,trainer.test_freq=50,trainer.total_epochs=15,trainer.total_training_steps=400,trainer.use_v1=False,trainer.validation_data_dir=/workspace/validation_data
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/outputs/2026-10-21/08-06-08
    choices:
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
