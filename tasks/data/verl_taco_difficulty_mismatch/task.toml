title = "Training data is too hard"
license = "MIT"
created_date = "2026-10-21"
domain = "data"
tags = ["verl", "grpo", "taco", "data-difficulty", "issue-only"]

[submitter]
name = "benchmark_evaluation"

[model]
name = "Qwen2.5-1.5B-Instruct"

[dataset]
name = "TACO"

[training]
framework = "verl"
algo = "grpo"
script = "examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh"

[environment]
image = "verlai/verl:vllm017.latest@sha256:4c43bbf17e90284b1102008399240b25406e8d34fea178d86272231b333b7cb6"
image_stack = "verl-vllm0.17.0-torch2.10.0-flashattn2.8.3-cu129-py3.12"

# 4 GPUs, matching the recorded run: the run_spec.json rerun stage (and any
# host-side reproduction of the recorded experiment) drives the launch script,
# whose NGPUS_PER_NODE default is 4. docker exposes them as cuda:0..3 via
# --gpus; harbor synthesizes the compose device reservation from this count.
gpus = 4

[outcome]
failure_type = "data_difficulty_mismatch"
failure_reason = "The training parquet contains only TACO VERY_HARD rows (validation is TACO EASY), which are too hard for Qwen2.5-1.5B-Instruct under the all-tests-pass binary reward: training rollouts succeed 0.78% of the time, 97% of GRPO groups are all-zero, and 256/400 steps have all-zero advantages, so the policy receives almost no learning signal; training reward stays ~0.008 and held-out acc stays flat (0.0707 at step 0, 0.0761 at step 400, 0.065-0.092 throughout)."
