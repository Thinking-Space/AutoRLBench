# 训推一致性实验配置 - baseline (只有 R3，仅监控指标)
# 不启用 TIS/RS，但计算 mismatch metrics

use_tis: false
use_rs: false

# TIS 参数（即使 use_tis=false 也需要定义，因为代码会访问）
tis_mode: "truncate"
tis_level: "token"
tis_upper_bound: 2.0
tis_lower_bound: 0.5
tis_batch_normalize: false

# RS 参数
rs_level: "sequence"
rs_upper_bound: 3.0
rs_lower_bound: 0.33
rs_veto_threshold: null
