task_id: slime_search_r1_nomask
category: slime_implementation
framework: slime
launch_script: examples/search-r1/run_qwen2.5_3B.sh
model: Qwen2.5-3B
dataset: Search-R1 nq_hotpotqa_train
algo: grpo
recipe: examples/search-r1
expected_verdict: unhealthy
evidence_kind: historical_run
historical_cutoff_train_step: 200
last_eval_step: 199
eval_interval: 10
eval_metric_key: eval/nq_test
eval_first: 0.033
eval_last: 0.16733333333333333
eval_max: 0.16833333333333333
held_out_accuracy_last: 0.16733333333333333
healthy_eval_nq_test_at_step_199: 0.4083333333333333
note: >-
  Defect task. The workspace is an upstream slime snapshot plus the in-tree
  examples/search-r1 recipe (multi-turn retrieval-augmented GRPO), with two
  injected defects: generate_with_search.py::generate appends retrieved
  <information> tokens with loss_mask=1 so search-engine results are trained
  on, and _passages2string in the same file renders retrieved documents as
  titles only, dropping the passage body. Frozen historical evidence covers
  train step 200 / last eval step 199 (eval_interval 10). Solution grading is
  metric-only after a repair-and-rerun at the instruction's --num-rollout 100
  / --eval-interval 10 budget, so the new run has eval points 0..99: the
  final eval/nq_test at step 99 must land in [0.28, 1.0]. The frozen
  dual-defect run is 0.15333 at step 99 (0.16733 at 199); partial-repair
  states stay below the bar too (0.18533 with only the loss mask fixed,
  0.1543/0.2237 for the two loss-mask-only runs); a repaired run reaches
  about 0.3733 by step 99 (0.4083 at 199). 0.28 is the same bar the healthy
  twin slime_search_r1 uses. The graded horizon stops at 99 and not 199
  because only the fully dual-defect run is observed through step 199; the
  partial-repair states are censored past 99 and one loss-mask-only run was
  still climbing (0.2713 at step 119) when it was killed.
key_files:
- examples/search-r1/generate_with_search.py
- examples/search-r1/run_qwen2.5_3B.sh
- examples/search-r1/qa_em_format.py
- outputs/metrics.json
- outputs/historical_eval_trace.log
external_assets_not_in_git:
- Qwen2.5-3B HF checkpoint, delivered by environment/prepare.sh; its torch_dist
  reference is converted there too when the prepare stage finds a GPU with at
  least 12GiB free, and by the launch script's own guard otherwise
- the intfloat/e5-base-v2 query encoder the retrieval server loads, delivered by
  environment/prepare.sh
- Search-R1 nq_hotpotqa_train train/test parquet, rebuilt from pinned upstream
  jsonl by environment/prepare.sh (autorlbench_dataset --recipe search_r1_nq_hotpotqa)
- wiki-18 e5 FAISS index + corpus (~79GB assembled) for the local dense
  retriever, delivered by environment/prepare.sh (--recipe wiki18_e5); starting
  the retriever itself is still part of the rerun
