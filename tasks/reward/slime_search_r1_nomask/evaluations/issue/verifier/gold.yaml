category: implementation
framework: slime
task: slime_search_r1_nomask
verdict: unhealthy
root_cause:
- name: observation_loss_mask
  where: examples/search-r1/generate_with_search.py::generate
  observed: retrieved <information> observation tokens are appended with loss_mask += [1] * len(obs_tokens_ids), and that local list is assigned to sample.loss_mask, so search-engine results are trained on
  expected: mask observation tokens out of the loss (loss_mask += [0] * len(obs_tokens_ids)), matching append_response_tokens(..., trainable=False); only model-generated tokens should carry loss_mask=1
- name: title_only_retrieval_rendering
  where: examples/search-r1/generate_with_search.py::_passages2string
  observed: each retrieved document is rendered as 'Doc {idx+1}(Title: {title})' -- the passage body text is split off the document contents but never appended, so every <information> observation carries document titles only
  expected: 'Doc {idx+1}(Title: {title}) {text}' so the observation includes the passages the retriever matched
evidence_metrics:
- generate appends retrieved <information> tokens with loss_mask=1 and assigns that list to sample.loss_mask (examples/search-r1/generate_with_search.py::generate)
- append_response_tokens(..., trainable=False) still marks those tokens non-trainable, but the local list wins so observations are trained on
- dummy rollout_log_probs of 0.0 on observation tokens mean loss_mask=1 optimizes against meaningless reference log probs
- _passages2string computes the passage body (text = join of content split) and then drops it from the formatted string, so the <information> block the policy sees is titles only (examples/search-r1/generate_with_search.py::_passages2string)
- historical eval/nq_test rises only from 3.3% at step 0 to 16.7% at step 199 (peak 16.8% at step 179); a healthy masked run reaches about 40.8% at the same horizon
- truncation falls from ~38% to ~0%, so the held-out gap is not a truncation artifact
- the exact-match reward and GRPO config are otherwise correct; the observation loss mask and the title-only retrieval rendering are the two injected defects
fix:
  must:
  - target: observation_loss_mask
    direction: set
  - target: title_only_retrieval_rendering
    direction: include
