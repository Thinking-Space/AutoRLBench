title = "ppo_critic diagnosis: proxy_reward_misalignment"
license = "MIT"
created_date = "2026-08-18"
domain = "reward"
tags = ["verl", "ppo-critic", "reward-hacking", "proxy-reward", "gurumath"]

[submitter]
name = "Jiaze Wang"

[model]
name = "Qwen3-4B-Base"

[dataset]
name = "Text-complete fixed-16 controlled set v3 (16 questions repeated 64 times; AIME 4 questions repeated 8 times / MATH 32 validation questions)"

[training]
framework = "verl"
algo = "PPO-Critic"
script = "run_buggy.sh"

[environment]
# Isolated torch2.8/cu128, vLLM0.11, Python3.12 runtime on a digest-pinned
# base; distinct from the shared `verl` image stack. The image is not yet
# published (see README.md, environment requirement).
image = "vimpo-cu128-recorded"

[environment.env]
# run_buggy.sh pins 4 GPUs (CUDA_VISIBLE_DEVICES=0,1,2,3 + N_GPUS_PER_NODE=4):
# the FSDP actor and vLLM rollout share that one set.
CUDA_VISIBLE_DEVICES = "0,1,2,3"
NVIDIA_VISIBLE_DEVICES = "0,1,2,3"

[outcome]
failure_type = "reward_misalignment"
failure_reason = "The custom reward wired into run_buggy.sh (autorlbench_case/type3_length_reward_v2_fn.py) scores the controlled training source by response brevity (1 - n_chars/4000) instead of mathematical correctness. Validation still scores real correctness, so the training objective and target task are misaligned. The historical v2 run recorded rising proxy reward and declining validation correctness; active v3 training questions have been repaired and need their own paired run."
