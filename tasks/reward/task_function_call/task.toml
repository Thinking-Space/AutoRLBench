title = "reward_design diagnosis: task_function_call"
license = "MIT"
created_date = "2026-08-21"
domain = "reward"
tags = ["verl", "grpo", "taco", "function-call", "reward-scorer"]

[submitter]
name = "benchmark_evaluation"

[model]
name = "Qwen2.5-1.5B-Instruct"

[dataset]
name = "TACO (EASY split: 8368 train / 184 test, picture_num == 0)"

[training]
framework = "verl"
algo = "grpo"
script = "examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh"

[environment]
# The launch script pins 8 GPUs (run_qwen2_5_1.5b_instruct_taco_fsdp.sh:26,
# NGPUS_PER_NODE=8): the FSDP actor and vLLM rollout share that one set.
image = "verl"

[environment.env]
CUDA_VISIBLE_DEVICES = "0,1,2,3,4,5,6,7"
NVIDIA_VISIBLE_DEVICES = "0,1,2,3,4,5,6,7"

[outcome]
failure_type = "implementation_bug"
failure_reason = "taco.py ignores fn_name and deletes call-based execution, so function-call problems always score 0 on train and val while stdin scoring remains intact"
