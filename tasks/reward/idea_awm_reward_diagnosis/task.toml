title = "Inaccurate rule-based task rewards in IDEA AWM OPSD"
license = "LicenseRef-IDEA4AutoRLBench-Composite"
created_date = "2026-10-22"
domain = "reward"
tags = ["idea", "verl", "awm", "opsd"]

[submitter]
name = "Jinyang Wu"

[model]
name = "locaszzz/IDEA_sft"

[dataset]
name = "locaszzz/IDEA_training_data; locaszzz/AgentWorldModel-1K"

[training]
framework = "IDEA / veRL / Agent World Model"
algo = "OPSD"
script = "run_local.sh"
script_args = ["--train"]

[environment]
# Static diagnosis only; optional training uses the separate idea-historical
# image. CPU-only, no GPUs declared: the issue tier reads the frozen evidence
# and the judge runs outside the sandbox. Runs on the packaged
# vllm0.11-torch2.8-cu128 image (py3.12): the scoring surface is fully
# environment-independent (issue tier = LLM judge over agent_answer.md outside
# the sandbox; solution tier = stdlib-only deterministic replay), so the
# recorded CPU-only diagnosis stack only supplies the evidence-reading pins
# (pyarrow 25.0.1 · omegaconf 2.3.1 · wandb 0.28.2 + their 20 transitive pins)
# -- those are shadowed at prepare time from $AUTORLBENCH_PREPARED/pysite,
# see environment/prepare.sh and environment/runtime/diagnosis-requirements.txt.
# The GPU training path stays structurally blocked regardless of host:
# run_local.sh pins /opt/idea/bin/python and reproduce.py requires AWM_PYTHON,
# neither of which any scoring image carries.
image = "ghcr.io/yhyayi/autorlbench:vllm0.11-torch2.8-cu128@sha256:6f7c302c0161a6c32d978faade165c86c153575baf028e729d7eebe44c06f683"
image_stack = "vllm0.11.0-torch2.8.0-flashattn2.8.3-cu128-py3.12"

[outcome]
failure_type = "reward_validity"
failure_reason = "Rule-based reward judgments are inaccurate: generated completion verifiers award full reward to trajectories that do not satisfy the requested task."
