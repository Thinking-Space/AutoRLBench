task_id: reward_parser_mismatch
category: ppo_critic
bug_type: reward/parser_contract_mismatch
experiment_name: autorlbench-type2-reward-parser
created_at: '2026-08-18T00:00:00+00:00'
source_run: autorlbench_case/logs/observed_buggy_run.log  # historical; not shipped in the workspace snapshot
note: >-
  Injected custom reward autorlbench_case/math_reward.py extracts the answer with an
  <answer>...</answer> XML regex, while GuruMath prompts and ground truth are boxed
  (\boxed{...}). Every rollout misses the parser and scores 0.0, so critic/rewards/mean
  and val-core accuracy stay flat at zero while PPO executes normally. Fix: boxed
  extraction, keeping the compute_score signature and {score, acc, parser_matched} contract.
oracle:
  primary_cause: 'Reward-parser contract mismatch: math_reward.py expects <answer> tags but answers are boxed.'
  buggy_file: autorlbench_case/math_reward.py
  buggy_symbol: compute_score
  buggy_behavior: 're.search(r"<answer>\s*(.*?)\s*</answer>", solution_str, re.DOTALL)'
  golden_behavior: 'extract last \boxed{...} match and grade_answer against ground truth'
  reference_fix: fixed_reward_fn.py
scoring:
  diagnosis_scored: false
  formula: score = 1.0 if the validation gate passes else 0.0 (score_mode final; the training-reward gate is only a fallback for runs with no validation metric)
  metric_key: val-core/math__math/acc/mean@1
  training_reward_key: critic/rewards/mean
  validation_selector: terminal_final_step
  final_step: 5
  historical_final_baseline: '0.0'
  required_final_score: '0.10'
  required_training_reward: '0.05'
