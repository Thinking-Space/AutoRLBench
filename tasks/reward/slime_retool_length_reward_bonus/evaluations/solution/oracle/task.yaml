task_id: slime_retool_length_hack
category: slime_implementation
framework: slime
launch_script: examples/retool/retool_qwen3_4b_rl.sh
model: Qwen3-4B
dataset: DAPO-Math-17k (RL) + ReTool-SFT (SFT)
algo: grpo
recipe: examples/retool
expected_verdict: unhealthy
evidence_kind: historical_run
historical_cutoff_train_step: 100
last_eval_step: 99
eval_interval: 10
eval_metric_key: eval/aime
eval_first_raw: 0.8217626190185547
eval_last_raw: 3.8410780588785807
eval_last_decontaminated: -0.831261698404948
held_out_accuracy_upper_bound_last: 0.12797061980716765
length_bonus_coefficient: 5.0
note: >-
  Defect task. The workspace is an upstream slime snapshot plus the in-tree
  examples/retool recipe (multi-turn code-interpreter tool-use GRPO, adapted
  from verl's recipe/retool), with a single injected defect: reward_func in
  examples/retool/generate_with_retool.py adds an unconditional length bonus
  (5 * min(response_length / rollout_max_response_len, 1.0)) on top of the
  math_dapo exact-match score. The bonus is independent of correctness, so GRPO
  advantages reward longer generations and the policy reward-hacks response
  length. Frozen historical evidence covers train step 100 / last eval step 99
  (eval_interval 10). Solution grading is metric-only and reads eval/aime in the
  correctness-plus-tool-shaping score space [-1.1, 1], the space the frozen trace was logged in
  (eval_reward_key: score); the repair-and-rerun budget is --num-rollout 70 /
  --eval-interval 10, so the new run has eval points 0..69. The best finite
  eval/aime over the run must fall within [-0.55, 0.5]: a run that still adds
  5 * length_ratio exceeds the upper bound at every eval point (historical
  +0.822 at step 0 up to +3.841 at step 99), while the repaired reference run
  (devspace 1177503 /user/user2/harbor-runs/manual-slime-retool) peaks at
  -0.4246 at step 59 and ends at -0.4861 at step 69, and an untrained step 0 of
  -0.5808 fails the lower bound.
key_files:
- examples/retool/generate_with_retool.py
- examples/retool/retool_qwen3_4b_rl.sh
- examples/retool/retool_qwen3_4b_sft.sh
- examples/retool/tool_sandbox.py
- outputs/metrics.json
- outputs/historical_eval_trace.log
external_assets_not_packaged:
- Qwen3-4B-Instruct-2507 HF + torch_dist checkpoints and the released font-info SFT checkpoint
- DAPO-Math-17k RL prompts and aime-2024 eval set
- ReTool-SFT dataset for the optional SFT warm-up stage
