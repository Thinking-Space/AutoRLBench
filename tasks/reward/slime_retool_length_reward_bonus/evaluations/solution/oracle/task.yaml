note: >-
  Defect task. The workspace is an upstream slime snapshot plus the in-tree
  examples/retool recipe (multi-turn code-interpreter tool-use GRPO, adapted
  from verl's recipe/retool), with two injected defects in
  examples/retool/generate_with_retool.py: reward_func adds an unconditional
  length bonus (5 * min(response_length / rollout_max_response_len, 1.0)) on
  top of the math_dapo exact-match score, and the tool-call parser reads
  tool_call_data.get("parameters", {}) while TOOL_TEMPLATE instructs
  {"name": ..., "arguments": ...}, so template-following code interpreter
  calls extract an empty code string and never execute. Frozen historical
  evidence covers train step 70 / last eval step 69 (eval_interval 10).
  Solution grading is metric-only after a repair-and-rerun at the
  instruction's --num-rollout 70 / --eval-interval 10 budget, so the new run
  has eval points 0..69: the final eval/aime at step 69, read in the
  math_dapo score space [-1, 1] the frozen trace was logged in
  (eval_reward_key: score), must land in [-0.55, 0.5]. The frozen dual-defect
  run logs +3.0138 at step 69 (above the upper bound); the partial-repair
  state with only the length bonus removed ends at -0.845 at step 69 (below
  the lower bound); the repaired reference run (devspace 1177503
  /user/user2/harbor-runs/manual-slime-retool) ends at -0.4861 at
  step 69 with a best of -0.4246 at step 59. The lower bound is calibrated
  on the measured repaired run; the upper bound on the unrepaired states.
key_files:
- examples/retool/generate_with_retool.py
- examples/retool/retool_qwen3_4b_rl.sh
