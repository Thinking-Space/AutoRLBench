title = "Judge reads the whole reasoning block"
license = "Apache-2.0"
created_date = "2026-11-18"
domain = "reward"
tags = ["miles", "grpo", "llm-judge", "thinking-mode", "regex", "silent-regression"]

[submitter]
name = "anbingxu"

[model]
name = "MiniCPM5-2.6B (SFT from GPT-OSS-synthesized data, job 562438 step 5097)"

[dataset]
name = "CHIMERA RL, pass@1-6 filtered"

[training]
framework = "miles"
algo = "grpo"
script = "scripts/minicpm5/2_6b/short_rl/run-minicpm5-26b-short-math-8k-colocate.sh"
script_args = [
  "--rm-type", "llm_judge_equiv",
  "--judge-model", "deepseek-v4-flash",
  "--judge-prompt-template", "rl_data/chimera_judge_gt_equiv_reasonfirst.txt",
  "--judge-kwargs", "temperature=0.0,max_tokens=4096",
  "--kl-loss-coef", "0.001",
  "--apply-chat-template-kwargs", "{\"enable_thinking\": true}",
  "--distributed-timeout-minutes", "60",
  "--no-load-optim",
  "--no-load-rng",
  "--finetune",
]

[environment]
# The recorded run used an internal registry image that cannot be pulled publicly.
# The issue tier only reads frozen evidence and never starts training, so the
# closest shared stack is pinned instead. Not smoke-tested against this script.
image = "slimerl/slime:v0.3.2-cu129@sha256:39be6cbb00f9b6770e664ace0c7b9f5ecff2977a1a205e7926a720f906fbc62c"
image_stack = "slime-v0.3.2-sglang0.5.15-torch2.11.0-flashattn2.8.3-cu129-py3.12"

# The recorded run used 16 GPUs (2 nodes x 8); the issue tier starts no training.
gpus = 0

[outcome]
failure_type = "reward_hacking"
failure_reason = "The ground-truth verdict is unhealthy because extract_non_reasoning_content strips reasoning with the paired regex <think>[\\s\\S]*?</think>, while the chat template prefills the opening <think> into the prompt so the response carries only the closing tag; the regex matches nothing and the judge receives the entire reasoning block plus the answer, which leaves rollout/raw_reward rising normally from 0.324 to 0.617 over 717 steps with no metric reporting what the judge actually saw"
