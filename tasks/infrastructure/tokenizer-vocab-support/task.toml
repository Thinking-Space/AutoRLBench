title = "GRPO actor and rollout probabilities diverge"
license = "Apache-2.0"
created_date = "2026-11-05"
domain = "infrastructure"
tags = ["probability-mismatch", "output-support", "policy-gradient", "issue-only"]

[submitter]
name = "Yong Yan"
[model]
name = "DeepSeek-R1-Distill-Qwen-7B@916b56a44061fd5cd7d6a8fb632557ed4f724f60"
[dataset]
name = "Skywork-OR1-RL-Data@1cdedc52e0e2db85fdf252f9be682e63a5a38c33, 7B difficulty1–15 and prompt<=1024"
[training]
framework = "verl-v0.9.1"
algo = "grpo"
script = "scripts/train.sh"
script_args = ["--check"]

[environment]
image = "verlai/verl:vllm024.dev2@sha256:b867883b0dd011363e69ab2ab344922a28c5bd0409e2a324e3ee70fb27ca7543"
image_stack = "verl-vllm0.24.0-torch2.11.0-flashattn2.8.3-cu130-py3.12"
gpus = 2
# Issue diagnosis reads frozen evidence and does not allocate GPUs. The recorded
# continuation itself used two GPUs, declared in configs/resolved_config.yaml.
[environment.env]
WANDB_MODE = "offline"

[outcome]
failure_type = "implementation_bug"
failure_reason = "The rollout masks tokenizer-unreachable output IDs while the FSDP actor includes them in log-probability and entropy normalization, exposing unreachable mass to policy gradients and causing severe backend log-probability mismatch and generation degeneration in the historical continuation."
