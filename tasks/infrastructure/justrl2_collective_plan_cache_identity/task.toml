title = "Collective plan cache omits communicator group and deadlocks CPxDP PPO"
license = "Apache-2.0"
created_date = "2026-11-23"
domain = "infrastructure"
tags = ["context-parallel", "data-parallel", "nccl-deadlock", "process-group", "collective-cache", "ppo"]

[submitter]
name = "Pan Haoxuan"
affiliation = "ModelBest"

[model]
name = "openbmb/JustRL-II-base-model"

[dataset]
name = "Countdown (Jiayi-Pan/Countdown-Tasks-3to4): 8,192 train / 1,024 disjoint test"

[training]
framework = "miles"
algo = "ppo"
script = "run_justrl2_ppo.sh"

[environment]
image = "ghcr.io/merak0514/autorlbench-justrl2@sha256:8d2eb1fe292a4e381915734b7854213002ca9bae6b50efab1bd8cc75cad14a8b"
image_stack = "miles-0.1.1-sglang0.5.20.dev59-torch2.13.0-flashattn4.0.0b19-cu129-py3.12"
gpus = 8

[environment.env]
WANDB_MODE = "offline"
TOKENIZERS_PARALLELISM = "false"

[outcome]
failure_type = "implementation_bug"
failure_reason = "miles/utils/collective_plan.py::_signature omits communicator group identity from the _plans cache key; under CP=2 x DP=2 PPO on Countdown, ranks 0 and 3 reuse the dp_group 'small' plan from distributed_masked_whiten inside cp_group compute_ess_ratio_contribution while ranks 1 and 2 miss on rank-in-group and call cp_group, causing a 4-rank cyclic NCCL deadlock at step 3 after critic warmup steps 0-2 succeed."
