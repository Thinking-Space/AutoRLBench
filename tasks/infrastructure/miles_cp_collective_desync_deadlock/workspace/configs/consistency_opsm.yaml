# 训推一致性实验配置 - OPSM only (R3 + OPSM)
# 只启用 OPSM，不启用 TIS/RS

use_tis: false
tis_mode: "truncate"
tis_level: "token"
tis_upper_bound: 2.0
tis_lower_bound: 0.5
tis_batch_normalize: false

use_rs: false
rs_level: "sequence"
rs_upper_bound: 3.0
rs_lower_bound: 0.33
rs_veto_threshold: null

use_opsm: true
opsm_delta: 0.0001
