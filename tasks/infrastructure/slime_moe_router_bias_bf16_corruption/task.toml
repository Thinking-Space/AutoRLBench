title = "Slime MoE router bias corrupted by BF16 loading"
license = "MIT"
created_date = "2026-11-27"
type = "infrastructure"
domain = "Reinforcement Learning"
tags = ["moe-router", "bf16-corruption", "checkpoint-loading", "silent-corruption", "controlled-reproduction"]

[submitter]
name = "Jiankai Sun"
github = "Jiankai-Sun"
affiliation = "Independent Researcher"

[model]
name = "Tiny 8-expert MoE policy"

[dataset]
name = "Deterministic two-action grouped-policy-gradient reproduction"

[training]
framework = "PyTorch controlled reproduction of Slime loader"
algo = "grouped policy gradient"
script = "train.py"

[environment]
image = "slimerl/slime:v0.3.2-cu129@sha256:39be6cbb00f9b6770e664ace0c7b9f5ecff2977a1a205e7926a720f906fbc62c"
image_stack = "slime-v0.3.2-sglang0.5.15-torch2.11.0-flashattn2.8.3-cu129-py3.12"
gpus = 0

[environment.env]
PYTHONDONTWRITEBYTECODE = "1"

[outcome]
failure_type = "implementation_bug"
failure_reason = "The loader copies FP32 MoE correction biases into a BF16 destination without first restoring the expert-bias buffer to FP32, collapsing eight router values to one, selecting expert 0 instead of 7, and ending at 0.02040 correct-action probability instead of 0.95893."
