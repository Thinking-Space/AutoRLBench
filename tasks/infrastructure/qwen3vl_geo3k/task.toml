title = "Flat image-token positions break training-rollout parity"
license = "Apache-2.0"
created_date = "2026-10-22"
domain = "infrastructure"
tags = ["verl", "grpo", "qwen3-vl", "multimodal", "rope", "log-prob"]

[submitter]
name = "benchmark_evaluation"

[model]
name = "Qwen3-VL-8B-Instruct"

[dataset]
name = "geometry3k (2101 train / 601 held-out)"

[training]
framework = "verl"
algo = "grpo"
script = "run_qwen3vl_geo3k_grpo.sh"

[environment]
# A dedicated verl image is required: Qwen3-VL needs vLLM 0.24 / torch 2.11 /
# CUDA 13, newer than what the shared `verl` environment ships.
image = "verlai/verl:vllm024.dev2@sha256:b867883b0dd011363e69ab2ab344922a28c5bd0409e2a324e3ee70fb27ca7543"
image_stack = "verl-vllm0.24.0-torch2.11.0-flashattn2.8.3-cu130-py3.12"

# Eight visible GPUs, the run script's NGPUS_PER_NODE default
# (run_qwen3vl_geo3k_grpo.sh:33,89 --trainer.n_gpus_per_node).
gpus = 8

[outcome]
failure_type = "implementation_bug"
failure_reason = "HFModelConfig uses raw AutoProcessor instead of the verl adapter, so missing multimodal RoPE capability triggers flat image positions in training; the recorded mean training-rollout KL is 0.006591 rather than 0.000623 nat/token with the adapter restored."
