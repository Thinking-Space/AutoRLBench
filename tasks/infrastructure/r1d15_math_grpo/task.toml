title = "Numerical policy divergence in a completed math GRPO run"
license = "Apache-2.0"
created_date = "2026-11-06"
domain = "infrastructure"
tags = ["verl", "grpo", "sequence-mis", "numerical-consistency", "hybrid-backend"]

[submitter]
name = "benchmark_evaluation"

[model]
name = "DeepSeek-R1-Distill-Qwen-1.5B"

[dataset]
name = "MATH 1460-question subset; AIME 2024 / 2025"

[training]
framework = "verl"
algo = "GRPO + sequence-MIS"
script = "scripts/train.sh"

[environment]
image = "verl-vllm0.8.5-torch2.6.0-flashattn2.7.4-cu124-py3.10"
gpus = 0

[outcome]
failure_type = "numerical_policy_divergence"
failure_reason = "BF16 FSDP2 learner and vLLM rollout forwards produce significantly different token probabilities despite synchronized nominal weights: the recorded token-weighted mean absolute logprob difference is 0.01121 nat and the maximum sampled-token probability difference reaches 0.999926."
