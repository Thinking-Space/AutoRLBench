title = "Log-prob recompute labels miss the causal roll"
license = "MIT"
created_date = "2026-09-09"
domain = "infrastructure"
tags = ["verl", "grpo", "taco", "log-prob", "off-by-one"]

[submitter]
name = "benchmark_evaluation"

[model]
name = "Qwen/Qwen2.5-1.5B-Instruct"

[dataset]
name = "TACO (EASY split: 8368 train / 184 test, picture_num == 0)"

[training]
framework = "verl"
algo = "grpo"
script = "examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh"

[environment]
# The launch script pins 8 GPUs (run_qwen2_5_1.5b_instruct_taco_fsdp.sh:26,
# NGPUS_PER_NODE=8): the FSDP actor and vLLM rollout share that one set.
image = "verl"

[environment.env]
CUDA_VISIBLE_DEVICES = "0,1,2,3,4,5,6,7"
NVIDIA_VISIBLE_DEVICES = "0,1,2,3,4,5,6,7"

[outcome]
failure_type = "implementation_bug"
failure_reason = "prepare_model_inputs in verl/workers/engine/fsdp/transformer_impl.py builds the log-prob labels un-rolled (input_ids_rmpad_rolled = input_ids_rmpad) instead of torch.roll(input_ids_rmpad, shifts=-1, dims=1), so the un-rolled labels fed to logprobs_from_logits and the fused shift_labels make every recomputed response log-prob off-by-one; the downstream no_padding_2_padding left-shift slice stays healthy and cannot recover the alignment"
