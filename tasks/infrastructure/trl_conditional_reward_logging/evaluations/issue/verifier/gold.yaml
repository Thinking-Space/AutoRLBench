category: infrastructure
framework: trl
task: trl_conditional_reward_logging
verdict: unhealthy
root_cause:
  - src/trl/trainer/grpo_trainer.py::GRPOTrainer._generate_and_score_completions iterates
    each rank's own pending metric and extra-column keys before invoking collectives,
    while the reward function emits answer_parse_rate only on rank 0, so the ranks issue
    different collectives at the same sequence number and torch.distributed reports a
    collective fingerprint mismatch before the first optimizer step
evidence_metrics:
  - the defective two-rank run crashes before the first optimizer step with a collective
    fingerprint mismatch (rank 0 in _ALLGATHER_BASE, rank 1 in BROADCAST at sequence
    number 18)
  - the control completes 24 optimizer steps with the final held-out evaluation and reward
    0.19140625, and both ranks log answer_parse_rate at all 12 generation events, matching
    the rank-0 rollout fractions (0.625 at the first event)
fix:
  must:
    - gather the union of pending metric and extra-column keys first and iterate it
      identically on every rank, and reduce metrics by the sum and count of actually
      supplied values so an absent rank is not treated as a zero observation
