title = "Distributed GRPO with conditional reward metrics"
license = "Apache-2.0"
created_date = "2026-10-30"
domain = "infrastructure"
tags = ["trl", "grpo", "gsm8k"]

[submitter]
name = "Haoyang Su"
github = "Hoyant-Su"
affiliation = "Fudan University; Shanghai Innovation Institute"

[model]
name = "Qwen2.5-0.5B-Instruct"

[dataset]
name = "GSM8K"

[training]
framework = "TRL"
algo = "GRPO with DAPO loss"
script = "train.sh"

[environment]
# Build-recipe exception (see docker/README.md "Exceptions"): no published
# image carries the TRL GRPO stack, so docker/images/trl-grpo-torch26.Dockerfile
# holds the recipe and must be built and pushed as
# autorlbench/trl-grpo-torch26:py312-cu124 once; the image pull fails until
# then. After the push, collapse the Dockerfile to a digest-pinned one-liner.
# Build recipe not yet built/pushed (see docker/README.md "Exceptions");
# pin the digest here once the image is pushed.
image = "autorlbench/trl-grpo-torch26:py312-cu124"
image_stack = "trl-grpo-torch26"

# 2 GPUs, matching the recorded runs: run_training.sh drives
# torch.distributed.run with --nproc_per_node=2 on two H100 80 GB (the two
# ranks exchange the conditional-metric collectives). docker exposes them as
# cuda:0..1 via --gpus; harbor synthesizes the compose device reservation
# from this count.
gpus = 2

[outcome]
failure_type = "distributed collective mismatch"
failure_reason = "Process-local custom metric keys cause unmatched collectives when only one rank emits a metric."
