title = "Fully-async GRPO in-flight rollouts kept alive across weight sync"
license = "Apache-2.0"
created_date = "2026-10-10"
domain = "infrastructure"
tags = ["miles", "grpo", "async-rollout", "weight-sync", "sglang", "throughput"]

[submitter]
name = "heqingfeng"

[model]
name = "Qwen3-1.7B"

[dataset]
name = "DAPO-Math-17k (dedup, 17917 prompts)"

[training]
framework = "miles"
algo = "grpo"
script = "scripts/train_grpo.sh"

[environment]
# TODO(image): the miles-async-rollout Dockerfile was removed by the 2026-11-05
# harness port and this name no longer resolves; the task needs the ngc-2506
# calibration stack (Megatron 4716f754 + sglang 0.5.16.dev44 lineage, the
# registered `miles-rl-lgs` / llm-rl/ngc-2506:nvidia.11b60366 image) as a
# digest-pinned docker/images/<name>.Dockerfile -- pending, see
# docker/images/miles-ngc2506-distributable.Dockerfile for the recipe.
image = "miles-async-rollout"

# scripts/train_grpo.sh pins the 4-GPU split (actor 2 + rollout 2); the
# recorded defective/control runs used 4xH800 under a fixed 8h wall clock.
gpus = 4

[outcome]
failure_type = "throughput_regression"
failure_reason = "DistBucketedWeightUpdateMixin._pause_and_prepare_engines overrides the configured pause_generation_mode from abort to in_place, so interrupted in-flight rollout requests are kept alive across each weight sync (and flush_cache is skipped), decode to full length against stale weights, and are then dropped by the max-weight-staleness 0 filter; the engine wastes full-length decode on groups that never train, so the fixed 8h wall clock completes 92 training steps vs the control's 148 and the end-of-window solve rate is 0.460 vs 0.539."
