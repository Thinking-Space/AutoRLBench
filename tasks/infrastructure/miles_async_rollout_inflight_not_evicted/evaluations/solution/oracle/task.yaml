note: >-
  Defect task on fully-async GRPO. The defect commit silently turns the
  configured abort-at-weight-sync into in_place, so interrupted rollout groups
  decode to full length and are then dropped as stale (max-weight-staleness 0).
  Per matched step the two arms are comparable; the defect costs throughput, so
  over a fixed 8h wall clock the defective arm completes 92 steps vs the control
  148, and ends at a lower solve rate (0.460 vs 0.539). Solution grading reads
  both train-step throughput (primary, >= 120) and the last-10%-window solve
  rate (secondary, >= 0.48) from the fresh experiment_logs; both must pass.
