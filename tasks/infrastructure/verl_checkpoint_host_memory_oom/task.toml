title = "Checkpoint saving exhausts host memory at step 10"
license = "Apache-2.0"
created_date = "2026-10-27"
domain = "infrastructure"
tags = ["verl", "grpo", "fsdp", "checkpoint", "optimizer-offload", "host-memory"]

[submitter]
name = "Jinyang Wu"

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"

[dataset]
name = "openai/gsm8k main (7473 train / 1319 test rows)"

[training]
framework = "verl 0.3.0.post1 / Ray 2.40.0 / vLLM 0.7.4"
algo = "GRPO"
script = "scripts/train.sh"

[environment]
image = "hiyouga/verl@sha256:864124d32147f5e9b31916656b441f19d77c1c03e3448c8504b0025df59121b2"
image_stack = "verl-vllm0.7.4-torch2.5.1-flashattn2.7.4-cu124-py3.10"

# launch.py asserts trainer.n_gpus_per_node == 1 (FSDP actor + vLLM rollout
# on one card). The remaining recording-rig env entries are exported by the
# task's own code, not seeded here: train.sh sets PYTHONPATH and
# PYTHONDONTWRITEBYTECODE, launch.py sets VLLM_USE_V1 / OMP_NUM_THREADS and
# asserts the 20 GiB cgroup limit against CONTAINER_MEMORY_LIMIT_BYTES (the
# harness has no memory-limit mechanism; environment/docker-compose.yaml is
# kept as the record of that resource contract).
gpus = 1

[outcome]
failure_type = "resource_exhaustion"
failure_reason = "CPU-offloaded Adam state leaves insufficient host-memory headroom for native checkpoint serialization at step 10. Retaining optimizer state on GPU reduces host-memory pressure under the same container budget."
