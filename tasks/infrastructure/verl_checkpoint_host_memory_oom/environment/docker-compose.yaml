# Harbor-only resource contract for infrastructure/verl_checkpoint_host_memory_oom:
# the 20 GiB host-RAM ceiling is part of the defect contract and launch.py asserts
# /sys/fs/cgroup/memory.max against it. The native docker runtime passes
# only --gpus/--shm-size, so the mem_limit/memswap_limit here apply exclusively on
# the Harbor backend (environment/docker-compose.yaml is injected there via
# --extra-docker-compose). On native docker the cgroup limit is NOT applied and
# the training run would not see the recorded 20 GiB budget: run this task on
# Harbor.
services:
  main:
    mem_limit: 21474836480
    memswap_limit: 21474836480
    shm_size: 1gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
