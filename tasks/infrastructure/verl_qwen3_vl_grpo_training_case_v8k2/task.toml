title = "Fused sequence-parallel GRPO trains on misaligned next-token labels"
license = "Apache-2.0"
created_date = "2026-10-24"
domain = "infrastructure"

[submitter]
name = "Gaoyuan"

[model]
name = "Qwen/Qwen3-VL-8B-Instruct"
revision = "0c351dd01ed87e9c1b53cbc748cba10e6187ff3b"
license = "apache-2.0"

[dataset]
name = "derek-thomas/ScienceQA image-bearing multiple choice"
revision = "f18b0a70359ebfb41f658fd564208d0355b013f4"
license = "cc-by-sa-4.0"

[training]
framework = "verl"
algo = "GRPO"
script = "scripts/run_training.py"
script_args = []

[environment]
# Migrated (2026-11-11) onto the packaged vllm0.11-torch2.8-cu128 image from
# the never-built vl-grpo-cu129-recorded recipe. The original recording ran
# on the author workstation's conda env (torch 2.8.0+cu129 / vLLM
# 0.11.0+cu129 / ray 2.49.2 / flash-attn 2.8.3, full freeze in
# environment/recorded-runtime-lock.txt). The cu128 image matches that stack
# version-for-version on every live compiled layer (vLLM 0.11.0, torch 2.8.0,
# triton 3.4.0, xformers 0.0.32.post1, transformers 4.57.6, nccl 2.27.3,
# cudnn 9.10.2.21) — only the CUDA build tag of torch/vLLM/flash-attn
# (cu128 vs cu129), ray 2.56.0 vs 2.49.2, and pure-Python pins differ;
# prepare.sh shadows numpy 1.26.4 + scipy 1.17.1 (verl pins numpy<2.0.0).
# TODO(rerun): the paired forty-step evidence (defective/repaired arms,
# mismatch counts, validation-change figures cited in README/oracle) was
# recorded on the cu129 workstation stack and still needs a full re-record on
# this image; the buggy run has been smoke-verified only.
image = "ghcr.io/yhyayi/autorlbench:vllm0.11-torch2.8-cu128@sha256:6f7c302c0161a6c32d978faade165c86c153575baf028e729d7eebe44c06f683"
image_stack = "vllm0.11.0-torch2.8.0-flashattn2.8.3-cu128-py3.12"

# FSDP4 FULL_SHARD DP2xSP2: run_training.py:22 asserts
# trainer.n_gpus_per_node == 4. The recording rig's thread pinning
# (OMP/MKL/OPENBLAS_NUM_THREADS=2, PYTHONDONTWRITEBYTECODE) is seeded into
# prepared/env by prepare.sh; WANDB_MODE is exported by the harness itself
# for every stage.
gpus = 4

[outcome]
failure_type = "fused_sequence_parallel_label_alignment"
failure_reason = "The fused FSDP path does not consistently consume globally shifted SP-sliced labels at local hidden-state positions. Real response-loss positions with nonzero advantages and gradients are affected. Paired forty-step observations show label correction and a 5.3515625pp validation-change improvement; measured before last-five validation change is -2.578125pp against a frozen -5pp quality-decline threshold."
