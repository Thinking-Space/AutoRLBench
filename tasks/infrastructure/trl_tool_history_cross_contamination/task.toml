title = "Python repair continuations use another rollout's history"
license = "Apache-2.0"
created_date = "2026-11-03"
domain = "infrastructure"
tags = ["trl", "tool-use", "issue-only"]
[submitter]
name = "PurvaChiniya"
[model]
name = "Qwen/Qwen3-4B"
[dataset]
name = "BugsInPy: 16 train, 4 development, 8 sealed bugs"
[training]
framework = "trl"
algo = "GRPO"
script = "run.sh"
[environment]
# Migrated 2026-11-13 onto the packaged verl-vllm0.24 image (was the unbuilt
# tool-rl-vllm024 recipe; see docker-build/original-docker/README.md). The
# compiled layer matches the recorded stack: torch 2.11.0+cu130 (byte-identical
# libs), vLLM 0.24.0 (the trainer's server-mode generation backend — the
# recorded version), flashinfer 0.6.12, numpy 1.26.4 (drift from the recorded
# 2.3.5 — the audit's layer-order reading was wrong; devspace-verified),
# tokenizers 0.22.2. The native versions the image freezes differently
# (ray 2.56.1 vs recorded 2.60.0, nccl 2.30.7 vs 2.28.9, pyarrow 25.0.0 vs
# 26.0.1) are accepted drift — the defective run was pilot-verified on this
# image (2×H800, 2026-11-13: full tool loop with real vLLM server, nccl
# weight transfer and the py3.9 case-venv corpus execution); the full
# reference-evidence re-record on this image is pending. The recorded
# pure-Python majors the GRPO stack is sensitive to (transformers 5.10.1 ·
# accelerate 1.15.0 · datasets 5.1.0 · peft 0.21.2 · wandb 0.31.0 ·
# huggingface_hub 1.33.0) are shadowed at prepare time into
# $AUTORLBENCH_PREPARED/pysite, and the py3.9 case-venv the corpus runner
# executes against (thefuck's pinned pytest 3.10.1 stack) is rebuilt inside
# the workspace — see environment/prepare.sh.
image = "verlai/verl:vllm024.dev2@sha256:b867883b0dd011363e69ab2ab344922a28c5bd0409e2a324e3ee70fb27ca7543"
image_stack = "verl-vllm0.24.0-torch2.11.0-flashattn2.8.3-cu130-py3.12"
prepare = "environment/prepare.sh"
[environment.env]
CUDA_VISIBLE_DEVICES = "0,1"
NVIDIA_VISIBLE_DEVICES = "0,1"
[outcome]
failure_type = "trl_tool_history_cross_contamination"
failure_reason = "Post-tool generation reuses the initial multiplicity and subsamples distinct histories, associating actions with the wrong rollout."
