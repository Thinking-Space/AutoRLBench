category: configuration
framework: verl
task: verl_grpo_adamw_eps_too_large
verdict: unhealthy
root_cause:
- name: adamw_eps_dominates_denominator
  where: run_gsm8k_grpo.sh (ADAM_EPS=0.001 -> actor_rollout_ref.actor.optim.override_optimizer_config={eps:0.001}, forwarded to torch.optim.AdamW)
  observed: per-parameter RMS gradients are about 1e-5 to 5e-5, so eps dominates sqrt(v_hat) + eps and AdamW becomes momentum SGD with steps 10-100x below the configured learning rate; the run learns the format about 30 steps late and held-out accuracy ends at 0.486
  expected: AdamW's default eps (1e-8), or any eps well below the per-parameter gradient scale
  required: the eps override and its effect on the Adam step must be named. "Learning is slow" or "the learning rate is too low" alone is partial. Healthy, sparse-reward, KL, clip-ratio, capacity, reward, data and sampler explanations are wrong
evidence_metrics:
- the ADAM_EPS=0.001 override in run_gsm8k_grpo.sh (override_optimizer_config={eps:0.001}, forwarded by build_optimizer to torch.optim.AdamW)
- actor/pg_clipfrac 8e-5 on average over steps 1-10 (control 2e-3); actor/ppo_kl within +/-2.1e-4; kl_loss 0.0012 at step 10 (control 0.039)
- training score 0.026 at step 10 (control 0.49), first >= 0.3 at step 35 (control step 5)
- held-out strict accuracy 0.002 (step 10) -> 0.295 (30) -> 0.486 (100); control 0.498 (10) -> 0.566 (100)
fix:
  must:
  - target: adamw_eps_dominates_denominator
    direction: remove the override so AdamW uses eps 1e-8
