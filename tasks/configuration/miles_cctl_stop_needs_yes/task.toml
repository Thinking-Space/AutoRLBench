title = "cctl job stop silently does nothing without --yes: interactive confirmation aborts non-TTY shell"
license = "Apache-2.0"
created_date = "2026-11-17"
domain = "configuration"
tags = ["miles", "cybertron", "cctl", "job-stop", "interactive-confirmation", "silent-failure", "infrastructure"]

[submitter]
name = "xuxiaoang"

[model]
name = "Qwen3.5-9B"

[dataset]
name = "tigan 10k rubric (arena-rubric RL)"

[training]
framework = "miles"
algo = "grpo"
script = "scripts/stop_jobs.sh"

[environment]
image = "ghcr.io/merak0514/autorlbench-justrl2@sha256:8d2eb1fe292a4e381915734b7854213002ca9bae6b50efab1bd8cc75cad14a8b"
image_stack = "miles-0.1.1-sglang0.5.20.dev59-torch2.13.0-flashattn4.0.0b19-cu129-py3.12"
# 0 GPU: this is a cluster job management task, not a GPU training task.
gpus = 0

[outcome]
failure_type = "configuration_silent_failure"
failure_reason = "cctl job stop requires the user to type the job name interactively as confirmation; in a non-TTY shell script, stdin is empty so the prompt reads nothing, prints 'stop task aborted; confirmation did not match', and returns ok:false — the job is never stopped; without --yes all stop commands silently fail while appearing to run."
