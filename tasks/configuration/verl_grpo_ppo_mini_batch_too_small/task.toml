title = "GRPO mini-batch far below the rollout batch: 32 updates per step"
license = "Apache-2.0"
created_date = "2026-10-29"
domain = "configuration"
tags = ["verl", "grpo", "gsm8k", "ppo_mini_batch_size", "off-policy", "hyperparameter"]

[submitter]
name = "Ziqi Zhou"

[model]
name = "Qwen2.5-0.5B-Instruct"

[dataset]
name = "GSM8K train 7,473 / held-out GSM8K test 1,319 (\\boxed{} prompt, Math-Verify reward)"

[training]
framework = "verl"
algo = "grpo"
script = "run_gsm8k_grpo.sh"

[environment]
# Runs on the packaged verl-vllm024.dev2 image — the same image
# infrastructure/qwen3vl_geo3k uses. verl itself is workspace-vendored
# (v0.9.0) and launched first on PYTHONPATH, so the image supplies the
# runtime stack: vLLM 0.24.0 (verl 0.9's adapter requires >=0.18), torch
# 2.11.0+cu130, flash-attn 2.8.3 baked in and active (the actor defaults to
# flash_attention_2), transformers 5.5.3, ray 2.56.1, tensordict 0.10.0.
# The repo's recorded evidence is from the original stack (torch 2.13 /
# vLLM 0.28, run natively). On this image the experiment was verified with a
# full 100-step run of the defective configuration (exit 0, 73 minutes on
# 1x H800) that reproduced the signature: held-out accuracy 0.49 at its peak
# (steps 10-30) falling to 0.31 at step 100, response truncation rising
# 0.06 -> 0.5, actor/ppo_kl 3-5e-3 throughout. prepare.sh shadows the
# scorer pins the image lacks (math-verify 0.9.0 + latex2sympy2_extended,
# with antlr4 4.9.3 to stay compatible with the image's omegaconf 2.3.1)
# into $AUTORLBENCH_PREPARED/pysite.
image = "verlai/verl:vllm024.dev2@sha256:b867883b0dd011363e69ab2ab344922a28c5bd0409e2a324e3ee70fb27ca7543"
image_stack = "verl-vllm0.24.0-torch2.11.0-flashattn2.8.3-cu130-py3.12"

# Single-GPU task: FSDP actor and vLLM rollout are colocated on one GPU
# (verified on 1x H800 80 GB). WANDB_MODE/WANDB_API_KEY are exported by
# the harness itself for every stage.
gpus = 1

[outcome]
failure_type = "off_policy_drift"
failure_reason = "run_gsm8k_grpo.sh sets PPO_MINI_BATCH_SIZE=4 ('smaller mini-batches to fit memory') against TRAIN_BATCH_SIZE=128 and ROLLOUT_N=8: verl multiplies ppo_mini_batch_size by rollout.n, so each rollout batch of 1,024 samples is consumed in 32 optimizer updates of 32 samples instead of the recipe's 4 updates of 256. The later updates of every step are computed on a policy that has already moved (actor/ppo_kl 0.003-0.004 vs 0.0002-0.0005 in the control, actor/grad_norm 1.0-2.0 vs 0.6-0.9), entropy rises 0.35 -> 0.73 instead of decaying to 0.06, responses lengthen and truncate (response_length/clip_ratio 0.07 -> 0.37, control 0.03), the training score peaks at 0.62 (step 30) and falls to 0.48 (control 0.75), and held-out GSM8K accuracy peaks at 0.494 (step 20) and ends at 0.361 under the grader's \\boxed{} rule (0.387 by Math-Verify), below its own step 0 (0.482). The same workspace launched with ppo_mini_batch_size=32 (same day, same node) reaches 0.565 (Math-Verify 0.566). With 8, 0.541. Memory is governed by ppo_micro_batch_size_per_gpu / dynamic batching, not by the mini-batch. No crash, no NaN."

[security]
requires_isolated_stages = true
