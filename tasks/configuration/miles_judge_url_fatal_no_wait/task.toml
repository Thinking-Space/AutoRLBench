title = "Training job entry fatals immediately when judge URL file is absent instead of waiting"
license = "Apache-2.0"
created_date = "2026-11-17"
domain = "configuration"
tags = ["miles", "judge", "startup", "FATAL", "wait-loop", "judge-url", "arena-rubric"]

[submitter]
name = "xuxiaoang"

[model]
name = "Qwen3.5-9B"

[dataset]
name = "tigan 10k rubric (arena-rubric RL)"

[training]
framework = "miles"
algo = "grpo"
script = "scripts/run_training.sh"

[environment]
image = "ghcr.io/merak0514/autorlbench-justrl2@sha256:8d2eb1fe292a4e381915734b7854213002ca9bae6b50efab1bd8cc75cad14a8b"
image_stack = "miles-0.1.1-sglang0.5.20.dev59-torch2.13.0-flashattn4.0.0b19-cu129-py3.12"
gpus = 8

[outcome]
failure_type = "startup_fatal_no_retry"
failure_reason = "The training entry script checks for the judge URL file at startup and exits 1 immediately if absent; the judge job was still Queued and had not yet written its URL file to scratch/judge_ips/, so the training job fatals with [FATAL] judge URL not found within seconds of starting rather than waiting for the judge to become available."
