# task.toml —— AutoRLBench task card（预排版默认值，上船后由 package-task 核准）

[task]
name = "t2i_multistyle_nonconvergence"
category = "configuration"
level = "issue"
summary = "全量多风格 T2I SFT loss 不收敛/震荡；小数据能收敛是混淆项，根因是优化配置(LR/掩码/batch)叠加数据噪声"

[workspace]
defective_side = "configs/full_defective.yaml"
frozen_evidence = "frozen_evidence/"
tools = "tools/inspect_logs.py"

[environment]
image = "default-cpu"
prepare_sh = "environment/prepare.sh"

[evaluations.issue]
instruction = "evaluations/issue/instruction.md"
oracle = "evaluations/issue/oracle.md"
verifier = "evaluations/issue/verifier/"

[evaluations.solution]
instruction = "evaluations/solution/instruction.md"
oracle = "evaluations/solution/oracle/"
verifier = "evaluations/solution/verifier/"